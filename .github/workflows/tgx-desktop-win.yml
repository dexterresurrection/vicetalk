name: talk-desktop-win
# Cloud Talk for Windows x64: Telegram Desktop at TD_TAG + desktop/apply.py, Release.
# A cold build of the libraries (Qt, WebRTC, FFmpeg…) does not fit into one 6-hour job on a 4-core runner,
# so three jobs continue each other: prepare.py skips every library whose cache key is already there, a library cut
# by the step timeout is rebuilt from scratch by the next job. Libraries travel between jobs as one 7z artifact.
# A later run can reuse them: set LIBS_RUN_ID to that run's id (artifact libs-3).
on:
  workflow_dispatch:
env:
  TD_TAG: v7.4.4
  XRAY: v26.11.9
  SDK: 10.0.26100.0
  LIBS_RUN_ID: ""
defaults:
  run:
    shell: cmd

jobs:
  libs1:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          path: talk
      - name: libraries, part 1
        uses: ./talk/.github/actions/tdlibs
        with:
          part: "1"
          minutes: "315"
  libs2:
    needs: libs1
    if: always()
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          path: talk
      - uses: actions/download-artifact@v4
        with:
          name: libs-1
          path: libs-in
      - name: libraries, part 2
        uses: ./talk/.github/actions/tdlibs
        with:
          part: "2"
          minutes: "315"
  libs3:
    needs: libs2
    if: always()
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          path: talk
      - uses: actions/download-artifact@v4
        with:
          name: libs-2
          path: libs-in
      - name: libraries, part 3
        uses: ./talk/.github/actions/tdlibs
        with:
          part: "3"
          minutes: "315"
  build:
    needs: libs3
    if: always()
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          path: talk
      - uses: actions/download-artifact@v4
        with:
          name: libs-3
          path: libs-in
      - name: build Cloud Talk
        uses: ./talk/.github/actions/tdbuild
