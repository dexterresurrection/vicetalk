name: talk-win-check
on: push
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Cloud Talk / Vice Talk installers on Windows
        shell: pwsh
        run: ./check.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: results
